name: deploy

# Manual only. Creating the resources and approving paid use remain owner actions.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      APP_PREFIX: ${{ vars.AZURE_APP_PREFIX || 'dlp' }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$RESOURCE_GROUP" && test -n "$ACR_NAME"
          result="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push" --jq '.workflow_runs | sort_by(.created_at) | last | .conclusion')"
          test "$result" = success || { echo 'This commit has no successful main CI run.'; exit 1; }
      - name: Sign in to Azure with short-lived credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build immutable release images
        run: |
          az acr build --registry "$ACR_NAME" --image "dlp-api:$RELEASE_SHA" --file apps/api/Dockerfile .
          az acr build --registry "$ACR_NAME" --image "dlp-web:$RELEASE_SHA" --file apps/web/Dockerfile .
      - name: Migrate first, roll out, and require healthy revisions
        run: |
          server="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          api_digest="$(az acr repository show --name "$ACR_NAME" --image "dlp-api:$RELEASE_SHA" --query digest -o tsv)"
          web_digest="$(az acr repository show --name "$ACR_NAME" --image "dlp-web:$RELEASE_SHA" --query digest -o tsv)"
          python3 scripts/azure_release.py deploy --resource-group "$RESOURCE_GROUP" --prefix "$APP_PREFIX" \
            --api-image "$server/dlp-api@$api_digest" --web-image "$server/dlp-web@$web_digest"
      - name: Verify the public sign-in boundary without paid provider calls
        run: |
          host="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_PREFIX-web" --query properties.configuration.ingress.fqdn -o tsv)"
          python3 scripts/verify_live.py --url "https://$host" --mode anonymous
      - name: Record remaining live checks
        run: |
          echo '### Deployment checks passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revision health, internal API configuration and anonymous sign-in boundary verified. Complete the signed-in model/speech/phone checklist in docs/GO_LIVE.md before accepting the release.' >> "$GITHUB_STEP_SUMMARY"
