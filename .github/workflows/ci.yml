name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure and container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile infrastructure (no Azure sign-in or deployment)
        run: az bicep build --file infra/main.bicep --outfile /tmp/dlp-infrastructure.json
      - name: Build API production image
        run: docker build --tag dlp-api:check --file apps/api/Dockerfile .
      - name: Check release command and Azure dependencies
        run: docker run --rm dlp-api:check python -m dlp.release --help
      - name: Build web production image
        run: docker build --tag dlp-web:check --file apps/web/Dockerfile .

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: dlp
          POSTGRES_DB: dlp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dlp -d dlp_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install the API
        working-directory: apps/api
        run: |
          pip install --require-hashes -r requirements-azure.lock
          pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check src tests ../../scripts/azure_release.py ../../scripts/verify_live.py ../../scripts/check_azure_config.py
      - name: Test
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dlp:dlp@localhost:5432/dlp_test
          REQUIRE_TEST_DATABASE: "true"
        run: pytest -q
      - name: Benchmark plumbing dry runs
        run: |
          python benchmarks/language/harness.py --provider expected | tee expected.txt
          python benchmarks/language/harness.py --provider wrong | tee wrong.txt
          grep -q "score=100.00%" expected.txt && grep -q "score=0.00%" wrong.txt
      - name: Check private source-import boundaries
        run: |
          pip install -r scripts/source-requirements.txt
          python -m unittest scripts/test_index_teaching_sources.py

  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: dlp
          POSTGRES_DB: dlp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dlp -d dlp_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install the API (for the end-to-end run)
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e "apps/api[dev]"
      - name: Install the web app
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Lint and type-check
        working-directory: apps/web
        run: npm run lint && npm run typecheck
      - name: Client regression tests
        working-directory: apps/web
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end (fixture providers)
        env:
          APP_ENV: development
          DEV_AUTH_ENABLED: "true"
          DEV_OWNER_EMAIL: owner@example.com
          OWNER_ALLOWLIST: owner@example.com
          ASSERTION_SIGNING_KEY: ci-only-signing-key-with-more-than-thirty-two-characters
          TEST_DATABASE_URL: postgresql+psycopg://dlp:dlp@localhost:5432/dlp_test
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: python scripts/run.py e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
